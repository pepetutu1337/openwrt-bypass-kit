# ============================================================
#  kit.conf — основные настройки. Правится ПОД СЕБЯ.
#  Это единственный файл, где живут адреса/порты твоего роутера.
# ============================================================

# --- как достучаться до роутера с компа ---
ROUTER_IP="192.168.1.1"     # LAN-адрес роутера (там же LuCI)
ROUTER_SSH_USER="root"
ROUTER_SSH_PORT="22"
# Ключ по умолчанию — обычный ~/.ssh/id_*. Если нужен конкретный:
# ROUTER_SSH_KEY="$HOME/.ssh/id_ed25519"

# --- сеть на самом роутере (обычно менять не нужно) ---
LAN_IFACE="br-lan"          # интерфейс со стороны клиентов
WAN_ZONE="wan"              # имя WAN в /etc/config/network

# --- прозрачный прокси (sing-box redirect) ---
PROXY_ENABLE="1"            # 1 = поднимать сплит-прокси, 0 = только zapret
REDIRECT_PORT="1100"        # локальный порт sing-box redirect-инбаунда
FAILOVER="1"                # 1 = urltest-пул из всех нод, 0 = только первая нода
FAILOVER_INTERVAL="15m"     # как часто перепроверять ноды (щадящий интервал)

# --- DoH (весь DNS резолвится через чистый зарубежный резолвер) ---
DOH_ENABLE="1"
DOH_PORT="5053"
DOH_UPSTREAM="https://1.1.1.1/dns-query"    # IP-форма! чтобы SNI не блочился
# второй DoH-резолвер для резервирования (пусто = не создавать)
DOH_PORT2="5054"
DOH_UPSTREAM2="https://8.8.8.8/dns-query"

# --- split-DNS: РФ-зоны через российский резолвер ---
# Нужно, т.к. зарубежный DoH НЕ видит записи VTB, Сбер-онлайн и пр.
# (они прячут DNS от иностранных резолверов) → сайт "не открывается совсем".
# Список зон/сервисов — в config/ru-split.list.
SPLIT_RU_ENABLE="1"
RU_DNS="77.88.8.8"      # Яндекс DNS (РФ-локализованный)
RU_DNS2="77.88.8.1"

# --- авто-список ушедших из РФ сервисов (geoblock) ---
# Тянется с itdoginfo/allow-domains, все домены идут через ноду.
GEOBLOCK_ENABLE="1"
GEOBLOCK_CRON="15 4 * * *"   # ежедневно 04:15 обновлять список
GEOBLOCK_URL="https://raw.githubusercontent.com/itdoginfo/allow-domains/refs/heads/main/Categories/geoblock.lst"

# --- сторож нод: если прокси упал, форсит пересбор (возврат инета) ---
WATCHDOG_ENABLE="1"
WATCHDOG_CRON="*/3 * * * *"  # проверка каждые 3 минуты

# --- zapret (обход DPI на прямом трафике: YouTube, голос Discord и т.д.) ---
ZAPRET_ENABLE="1"
ZAPRET_VERSION="v72.12"     # релиз bol-van/zapret для установки на чистый роутер

# --- прочее ---
BLOCK_QUIC="1"              # REJECT udp/443 lan->wan, чтобы плееры откатывались на TCP

# ============================================================
#  zapret.conf — стратегии обхода DPI для ПРЯМОГО трафика (не через ноду).
#  Эти строки подставляются в /opt/zapret/config на роутере при `apply`.
#
#  Дефолты ниже — рабочая связка, проверенная на Ростелекоме (mediatek/filogic):
#   - TCP:443 SNI-десинк для YouTube и сайтов
#   - UDP-профили для ГОЛОСОВЫХ каналов Discord и QUIC
#  Если у другого провайдера не заведётся — подбирают через
#  /opt/zapret/blockcheck.sh (сначала `netctl zapret off`, чтобы не мешал).
# ============================================================

# Порты, которые слушает nfqws
ZAPRET_PORTS_TCP="80,443"
ZAPRET_PORTS_UDP="443,50000-50099"

# Основные стратегии десинхронизации.
# <HOSTLIST> = авто+пользовательский список доменов; <HOSTLIST_NOAUTO> = без автообучения.
ZAPRET_NFQWS_OPT='
--filter-tcp=80 --dpi-desync=fake,multisplit --dpi-desync-split-pos=method+2 --dpi-desync-fooling=md5sig <HOSTLIST> --new
--filter-tcp=443 --dpi-desync=fake --dpi-desync-ttl=3 --dpi-desync-fake-tls-mod=rnd,dupsid,rndsni,padencap <HOSTLIST> --new
--filter-udp=443 --dpi-desync=fake --dpi-desync-repeats=11 <HOSTLIST_NOAUTO> --new
--filter-udp=50000-50099 --filter-l7=discord,stun --dpi-desync=fake --dpi-desync-any-protocol --dpi-desync-cutoff=d3 --dpi-desync-repeats=6
'

# Домены, которые zapret обходит НАПРЯМУЮ (не через прокси).
# Обычно это тяжёлое видео, которое глупо гнать через ноду.
ZAPRET_HOSTS='
googlevideo.com
ytimg.com
ggpht.com
youtube.com
youtu.be
googleapis.com
googleusercontent.com
gvt1.com
gvt2.com
discord.com
discordapp.com
discordapp.net
discord.gg
discord.media
'
